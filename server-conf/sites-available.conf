server {
    listen 80;
    server_name topframerow.my.id;

    # FRONTEND ROOT (STATIC / SPA BUILD)
    root /var/www/production/topframerow-fe-dist;
    index index.html;

    # BASIC HARDENING
    client_max_body_size 50M;
    server_tokens off;

    # SPA ROUTING (FALLBACK TO INDEX)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # STATIC ASSETS CACHING
    location ~* \.(css|js|mjs|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # SECURITY HEADERS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # LOGGING
    access_log /var/log/nginx/topframerow.my.id.access.log;
    error_log  /var/log/nginx/topframerow.my.id.error.log;
}
